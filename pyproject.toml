[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mig-scheduling-research"
version = "0.12.0"
description = "M12: MFI Figure 3 conformance and paper-path baseline semantics audit."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0"]
analysis = ["matplotlib>=3.9"]

[project.scripts]
mig-sim = "mig_scheduler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
